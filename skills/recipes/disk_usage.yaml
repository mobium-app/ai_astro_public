name: disk_usage
description: zajętość dysków i partycji (df -h)
order: 18
patterns:
  - 'ile (?:jest )?wolnego (?:miejsca|dysku)'
  - '(?:zajetosc|uzycie) (?:dyskow|partycji|miejsca)'
  - 'stan dyskow'
  - 'wolne miejsce na dysku'
command: 'df -h -x tmpfs -x devtmpfs'
confirm: never
timeout: 30
done: 'Zajętość dysków pokazana powyżej.'
