name: Good first issue
description: Łatwe zadanie dla nowych kontrybutorów — dobry pierwszy PR
title: "[good-first] "
labels: ["good first issue", "help wanted"]
body:
  - type: markdown
    attributes:
      value: "To zadanie jest oznaczone jako dobre na start: małe, dobrze zdefiniowane, bez wymaganego sprzętu (działa w testach hermetycznych)."
  - type: textarea
    id: task
    attributes:
      label: Zadanie
      description: "Opis celu i kryteriów akceptacji."
    validations:
      required: true
  - type: textarea
    id: hints
    attributes:
      label: Podpowiedzi
      description: "Gdzie szukać kodu, jakie wzorce stosować (stdlib unittest, hermetyczność)."
  - type: checkboxes
    id: acceptance
    attributes:
      label: Kryteria
      options:
        - label: "Testy hermetyczne przechodzą: `python3 tests/run_tests.py`"
        - label: "Brak danych prywatnych / sekretów w zmianie"
        - label: "Commit w języku angielskim (opis), kod zwięzły"