name: dns_lookup
description: rozwiązuje nazwę domeny na adres IP (getent/dig)
order: 48
patterns:
  - 'adres ip (?:dla |strony )?(?P<host>[\w.-]+)'
  - 'na jaki (?:adres|ip) wskazuje (?P<host>[\w.-]+)'
  - 'rozwin (?:nazwe |domenę )?(?P<host>[\w.-]+)'
  - 'dns (?:dla )?(?P<host>[\w.-]+)'
command: 'getent hosts {{host}} || nslookup {{host}}'
confirm: never
timeout: 30
done: 'Wynik rozwiązania nazwy pokazany powyżej.'
