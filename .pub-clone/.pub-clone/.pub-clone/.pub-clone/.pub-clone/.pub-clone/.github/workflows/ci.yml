name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r requirements.txt
      - name: Lint (compile)
        run: |
          python3 -m compileall -q .
      - name: Tests (hermetyczne)
        env:
          ASTRO_CI: "1"
        run: |
          python3 tests/run_tests.py