name: cron_jobs
description: zaplanowane zadania (crontab + timery systemd)
order: 39
patterns:
  - 'zaplanowane zadania'
  - 'harmonogram zadan'
  - 'crontab'
  - 'timery systemd'
command: "crontab -l 2>/dev/null; echo '--- timery ---'; systemctl list-timers --no-pager 2>/dev/null | head -n 15"
confirm: never
timeout: 30
done: 'Zaplanowane zadania i timery pokazane powyżej.'
