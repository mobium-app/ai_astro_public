name: sensors_temp
description: temperatury czujników i throttling (vcgencmd/sensors)
order: 42
patterns:
  - 'temperatura (?:czujnikow|soc|soc-u|soc-ie)'
  - 'temperatura (?:wewnetrzna|podzespolow)'
  - 'czy sie (?:przegrzewa|grzeje)'
  - 'czujniki temperatury'
command: 'vcgencmd measure_temp 2>/dev/null; vcgencmd get_throttled 2>/dev/null; sensors 2>/dev/null | head -n 30'
confirm: never
timeout: 20
done: 'Temperatury i stan throttlingu pokazane powyżej.'
