name: ping_host
description: sprawdza osiągalność hosta (ping)
order: 47
patterns:
  - 'ping (?:do |na )?(?P<host>[\w.-]+)'
  - 'sprawdz (?:polaczenie z|osiagalnosc) (?P<host>[\w.-]+)'
  - 'czy (?:jest )?(?:osiagalny|osiagalna) (?P<host>[\w.-]+)'
  - 'czy dziala (?P<host>[\w.-]+)'
command: 'ping -c 3 -W 2 {{host}}'
confirm: never
timeout: 30
done: 'Wynik ping pokazany powyżej.'
