name: Feature request
description: Pomysł na nową funkcję / ulepszenie
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Pomysł
      description: "Co chcesz dodać lub zmienić?"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Dlaczego
      description: "Jaki problem to rozwiązuje? Dla kogo?"
  - type: checkboxes
    id: scope
    attributes:
      label: Obszar (zaznacz, co pasuje)
      options:
        - label: Nowe narzędzie / komenda PL
        - label: STT / TTS / mowa
        - label: Wizja / kamera
        - label: Trening / destylacja / wiedza
        - label: Dokumentacja / CI / packaging
        - label: Inne (opisz w polu „Pomysł")