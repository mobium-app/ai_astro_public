name: venv_packages
description: pakiety i wersja Pythona w wirtualnym środowisku projektu
order: 40
patterns:
  - '(?:pokaz|wyswietl|lista|sprawdz)?\s*(?:zainstalowane\s+)?pakiety\s+(?:w\s+)?(?:venv|srodowisku wirtualnym|srodowisku|wirtualnym)'
  - 'co jest w (?:venv|srodowisku wirtualnym|wirtualnym)'
  - 'wersja (?:pythona )?w (?:venv|srodowisku wirtualnym)'
commands:
  - command: '{{base|@project}}/venv/bin/python --version'
    say: 'Sprawdzam środowisko wirtualne.'
  - command: '{{base|@project}}/venv/bin/pip list --format=columns'
confirm: never
timeout: 120
done: 'Pakiety w środowisku wirtualnym wypisane powyżej.'
