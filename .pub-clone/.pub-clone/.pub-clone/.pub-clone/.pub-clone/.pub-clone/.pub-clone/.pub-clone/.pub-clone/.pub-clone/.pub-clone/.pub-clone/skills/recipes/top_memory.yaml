name: top_memory
description: procesy zużywające najwięcej pamięci RAM
order: 50
patterns:
  - 'procesy (?:z )?(?:najwiekszym )?(?:zuzyciem )?(?:ram|pamieci)'
  - 'co zjada (?:ram|pamiec)'
command: 'ps aux --sort=-%mem | head -n 10'
confirm: never
timeout: 30
done: 'Procesy z największym zużyciem RAM wypisane powyżej.'
