name: astro_backup
description: kopia zapasowa pamięci i konfiguracji ASTRO do ~/astro/backups
order: 80
patterns:
  - 'kopi[ae] zapasow[ae] (?:systemu|astro|danych|konfiguracji)'
  - 'zbackupuj(?: system| astro| dane| pamiec)'
command: 'mkdir -p ~/astro/backups && tar czf ~/astro/backups/astro-$(date +%Y%m%d-%H%M%S).tar.gz -C ~/astro runtime/memory.db config knowledge 2>/dev/null; ls -1 ~/astro/backups | tail -n 1'
confirm: always
timeout: 300
done: 'Kopia zapasowa ASTRO wykonana.'
