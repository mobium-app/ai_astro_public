name: failed_services
description: usługi systemd, które zakończyły się błędem
order: 26
patterns:
  - 'uslugi (?:z )?bledami'
  - 'uslugi ktore (?:nie dzialaja|padly)'
  - 'nieudane uslugi'
  - 'problemy z uslugami'
command: 'systemctl --failed --no-pager'
confirm: never
timeout: 30
done: 'Nieudane usługi pokazane powyżej.'
