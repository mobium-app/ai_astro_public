name: astro_status
description: stan usługi ASTRO (systemctl status astro.service)
order: 15
patterns:
  - 'status (?:uslugi |serwisu )?astro(?:\.service)?'
  - 'stan astro'
  - 'czy astro dziala'
command: 'systemctl status astro.service --no-pager'
confirm: never
timeout: 30
done: 'Stan usługi ASTRO wypisany powyżej.'
